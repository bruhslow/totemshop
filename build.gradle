plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.+'
}

def minecraft_version = "26.2"
def loader_version = "0.20.1"
def fabric_api_version = "0.161.0+26.2"

def mod_version = "1.0.0"
def mod_id = "totemshop"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
}

processResources {
    filesMatching('fabric.mod.json') {
        expand "mod_version": mod_version, "mod_id": mod_id, "loader_version": loader_version, "minecraft_version": minecraft_version
    }
}

jar {
    archiveBaseName.set(mod_id)
    archiveVersion.set(mod_version)
}
